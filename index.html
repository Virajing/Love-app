<!DOCTYPE html>
<html lang="en">
<head>
  <title>Love App</title>
  <style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    h1 {
        margin-bottom: 20px;
        text-align: center;
    }

    .container {
        position: relative;
        width: 90vw;
        height: 60vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }

    /* Button Styles */
    #noButton, #yesButton {
        padding: 12px 24px;
        border: none;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s ease;
        font-size: 1rem;
        border-radius: 8px;
    }

    #noButton {
        background-color: red;
    }

    #yesButton {
        background-color: green;
    }

    #noButton:hover {
        background-color: darkred;
    }

    #yesButton:hover {
        background-color: darkgreen;
    }

    #p {
        font-size: 1.2rem;
        text-align: center;
    }
  </style>
</head>
<body>
  <h1>Do you love me?</h1>
  <div class="container">
    <button onclick="yes()" id="yesButton">Yes</button>
    <button onclick="no()" id="noButton">No</button>
    <p id="p"></p>
  </div>

  <script>
    let noCounter = 0;
    const messages = [
        "Baby, don't do that😥",
        "Are you sure? 💔",
        "Please say yes 😢",
        "I might cry 😭",
        "Come on, don't break my heart! 💕",
        "You're making me sad 😞",
        "Viraj is heartbroken 💔",
        "Don't make Viraj sad 😢",
        "Please, baby, reconsider 😭",
        "You're my everything 💖",
        "Without you, I feel lost 😞",
        "I can't believe you're saying no 😭",
        "Is this really what you want? 💔",
        "You are my world! 🌎",
        "Don't do this, love 😢",
        "You're making me cry 💦",
        "I need you! 💕",
        "Viraj won't give up on you 😌",
        "Every 'No' hurts more 😢",
        "I still love you anyway 😍",
        "How can you say no to this face? 🥺",
        "One more chance, please! 💘",
        "Let's try again, love 💞",
        "Don't break my heart like this 💔",
        "Come back, my love! 😥",
        "I know you love me deep inside 💕",
        "Think again before breaking my heart 💝",
        "I'm serious, baby! 😘",
        "Do you really mean that? 😰",
        "Viraj is not happy with this response 😭",
        "I believe in our love 💗",
        "You're the light of my life ✨",
        "I can't handle rejection 💔",
        "Why are you hurting me like this? 😞",
        "Give me another chance! 🥰",
        "Don't let this be the end 😭",
        "You’re my soulmate! 💞",
        "I thought we were forever 💕",
        "Please change your mind! 😘",
        "Just one 'Yes' and I'll be the happiest! 😊",
        "How can you resist me? 🤭",
        "You know you love me too! 💖",
        "This is just a misunderstanding, right? 😰",
        "You're my everything, please don't do this! 💔",
        "I won't stop until you say yes! 😘",
        "What if I bribe you with love? 🥺",
        "Come on, don't be so mean! 😣",
        "Even the stars say we belong together! ✨",
        "No? Really? That hurts 😢",
        "Every 'No' makes me love you more 💖",
        "Just say yes, you won't regret it! 😘"
    ];

    function yes() {
        const para = document.getElementById('p');
        para.textContent = "I knew you'd say yes! 😍🥰";
        document.getElementById('noButton').style.display = 'none';
        document.getElementById('yesButton').style.display = 'none';
    }

    function no() {
        const para = document.getElementById('p');
        para.textContent = messages[noCounter % messages.length];
        noCounter++;
    }
  </script>
</body>
</html>
