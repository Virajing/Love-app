<!DOCTYPE html>
<html lang="en">
<head>
  <title>Love App</title>
  <style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    h1 {
        margin-bottom: 20px;
        text-align: center;
    }

    .container {
        position: relative;
        width: 20vw;
        height: 20vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }

    /* Button Styles */
    #teleportButton, #Button {
        padding: 12px 24px;
        border: none;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s ease;
        font-size: 1rem;
        border-radius: 8px;
        position: absolute;
    }

    #teleportButton {
        background-color: red;
    }

    #Button {
        background-color: green;
        position: relative;
    }

    #teleportButton:hover {
        background-color: darkred;
    }

    #Button:hover {
        background-color: darkgreen;
    }

    #p {
        font-size: 1.2rem;
        text-align: center;
    }
  </style>
</head>
<body>
  <h1>Do you love me?</h1>
  <div class="container">
    <button onclick="yes()" id="Button">Yes</button>
    <button onclick="no()" id="teleportButton">No</button>
    <p id="p"></p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const button = document.getElementById('teleportButton');
      const container = document.querySelector('.container');

      button.addEventListener('mouseover', () => {
          const containerRect = container.getBoundingClientRect();
          const buttonRect = button.getBoundingClientRect();

          const maxX = window.innerWidth - buttonRect.width;
          const maxY = window.innerHeight - buttonRect.height;

          const randomX = Math.random() * maxX;
          const randomY = Math.random() * maxY;

          button.style.left = `${randomX}px`;
          button.style.top = `${randomY}px`;
      });
    });

    function yes() {
        const para = document.getElementById('p');
        para.textContent = "I knew you'd say yes! 😍🥰";
        document.getElementById('teleportButton').style.display = 'none';
        document.getElementById('Button').style.display = 'none';
    }

    function no() {
        const para = document.getElementById('p');
        para.textContent = "I am serious baby😘😥";
    }
  </script>
</body>
</html>
